<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>BEAT THE MIX 会員ガイド</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
  background: #f8f9fa;
  color: #333;
  line-height: 1.8;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.header {
  background: linear-gradient(135deg, #FF6B35, #FF4D6D);
  color: #fff;
  padding: 3rem 2rem;
  text-align: center;
}
.header h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 0.5rem; font-family: 'Oswald', 'Noto Sans JP', sans-serif; }
.header p { opacity: 0.9; font-size: 0.95rem; }

.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  margin-top: 1rem;
  padding: 0.5rem 1.2rem;
  background: rgba(255,255,255,0.2);
  color: #fff;
  border-radius: 50px;
  text-decoration: none;
  font-size: 0.85rem;
  font-weight: 600;
  transition: background 0.2s;
}
.back-btn:hover { background: rgba(255,255,255,0.35); }

.container {
  max-width: 600px;
  margin: 0 auto;
  padding: 3rem 1.5rem 4rem;
  width: 100%;
}

.select-title {
  text-align: center;
  font-size: 1.05rem;
  font-weight: 600;
  margin-bottom: 2rem;
  color: #555;
}

.class-card {
  display: block;
  border-radius: 16px;
  padding: 2rem;
  margin-bottom: 1.5rem;
  text-decoration: none;
  text-align: center;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  transition: transform 0.15s, box-shadow 0.15s;
}
.class-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(0,0,0,0.12);
}

.class-card-kids {
  background: linear-gradient(135deg, #FF6B35, #FF4D6D);
  color: #fff;
}
.class-card-future {
  background: linear-gradient(135deg, #0D1B2A, #1B263B);
  color: #D4A853;
}

.class-card .class-name {
  font-size: 1.6rem;
  font-weight: 700;
  letter-spacing: 0.15em;
  font-family: 'Oswald', 'Noto Sans JP', sans-serif;
  margin-bottom: 0.3rem;
}
.class-card .class-desc {
  font-size: 0.9rem;
  opacity: 0.85;
}

@media (max-width: 600px) {
  .header { padding: 2rem 1rem; }
  .header h1 { font-size: 1.4rem; }
  .container { padding: 2rem 1rem; }
  .class-card { padding: 1.5rem; }
}
</style>
</head>
<body>

<div class="header">
  <h1>BEAT THE MIX 会員ガイド</h1>
  <p>会員ページの使い方をご案内します</p>
  <a href="members-page.html" class="back-btn">&larr; 会員ページに戻る</a>
</div>

<div class="container">

  <p class="select-title">お通いのクラスを選択してください</p>

  <a href="member-manual-kids.html" class="class-card class-card-kids">
    <div class="class-name">KIDS</div>
    <div class="class-desc">KIDSクラス会員の方はこちら</div>
  </a>

  <a href="member-manual-future.html" class="class-card class-card-future">
    <div class="class-name">FUTURE</div>
    <div class="class-desc">FUTUREクラス会員の方はこちら</div>
  </a>

</div>

</body>
</html>
